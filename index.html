<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>作業完了報告書メーカー</title>
<script src="./jspdf.umd.min.js"></script>
<script src="./supabase.js"></script>
<script src="./config.js"></script>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="報告書">
<meta name="theme-color" content="#1E5B75">
<style>
:root{
  --bg:#E9EDEF; --surface:#FFFFFF; --ink:#1B2428; --muted:#5C696F; --line:#CBD3D7;
  --accent:#1E5B75; --accent-ink:#FFFFFF; --accent-soft:#DCE9EF; --warn:#C98E0B; --warn-soft:#FBF1D6;
  --danger:#A8322B; --shadow:0 1px 2px rgba(20,40,50,.12),0 6px 18px rgba(20,40,50,.08);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12181B; --surface:#1B2327; --ink:#E6ECEE; --muted:#97A5AB; --line:#33424A;
    --accent:#6FB3D2; --accent-ink:#0C1A20; --accent-soft:#1F3440; --warn:#E5B23C; --warn-soft:#3A3120;
    --danger:#E0756C; --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12181B; --surface:#1B2327; --ink:#E6ECEE; --muted:#97A5AB; --line:#33424A;
  --accent:#6FB3D2; --accent-ink:#0C1A20; --accent-soft:#1F3440; --warn:#E5B23C; --warn-soft:#3A3120;
  --danger:#E0756C; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:fixed;width:1px;height:1px;opacity:0;overflow:hidden;left:0;bottom:0;z-index:-1}
img{max-width:100%}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:54px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:30px;height:38px;border:2px solid var(--ink);border-radius:2px;position:relative;flex:none;background:var(--surface)}
.brand-mark::before{content:"";position:absolute;left:4px;right:4px;top:6px;height:2px;background:var(--ink);box-shadow:0 5px 0 var(--ink),0 10px 0 var(--accent),0 15px 0 var(--accent)}
.brand-t{font-weight:700;font-size:17px;letter-spacing:.08em}
.brand-s{font-size:12px;color:var(--muted)}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 4px;white-space:nowrap}
.bar-title{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.save{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.save.is-dirty{background:var(--warn);border-color:var(--warn);color:#1E1606}
.save.is-dirty::before{content:"●";font-size:9px;margin-right:6px;vertical-align:2px}
.tabs{display:flex;max-width:760px;margin:0 auto;padding:0 8px}
.tabs button{flex:1;border:0;background:none;padding:10px 4px 9px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.count{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;margin-left:2px}

main{max-width:760px;margin:0 auto;padding:16px 14px 120px}
.h2{font-size:14px;font-weight:700;color:var(--muted);margin:22px 2px 10px;letter-spacing:.04em}
.h2:first-child{margin-top:4px}

/* home */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow)}
.tile:active{transform:scale(.98)}
.mini{background:#fff;border:1px solid #9AA6AB;display:block;padding:5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.mini.portrait{width:62px;height:88px}
.mini.landscape{width:96px;height:68px;margin:10px 0}
.mini i{display:grid;grid-template-columns:repeat(var(--c),1fr);grid-template-rows:repeat(var(--r),1fr);gap:3px;width:100%;height:100%}
.mini b{background:#C8D6DC;border-bottom:3px solid #8FA1A9}
.tile-t{font-weight:700;font-size:16px;margin-top:4px}
.tile-s{font-size:12px;color:var(--muted);text-align:center}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item-main{flex:1;min-width:0;border:0;background:none;display:flex;align-items:center;gap:12px;padding:12px;text-align:left}
.item-ico{flex:none;background:#fff;border:1px solid #9AA6AB}
.item-ico.portrait{width:26px;height:36px}.item-ico.landscape{width:36px;height:26px}
.item-t{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-s{display:block;font-size:12px;color:var(--muted)}
.icon-btn{border:0;border-left:1px solid var(--line);background:none;width:52px;font-size:20px;color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);font-size:14px}

/* settings */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.prow+.prow{border-top:1px solid var(--line)}
.plabel{font-size:14px;font-weight:600}
.phint{font-size:12px;color:var(--muted);font-weight:400}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:none;padding:7px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.stepper button{border:0;background:none;width:40px;height:36px;font-size:20px;color:var(--accent)}
.stepper button:disabled{color:var(--line)}
.stepper b{min-width:54px;text-align:center;font-size:15px}

/* forms */
.fgroup{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px 12px;margin-bottom:14px}
.fgroup h3{font-size:13px;color:var(--accent);margin:10px 0 2px;letter-spacing:.06em}
.field{display:block;margin-top:10px}
.field>span{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.sheet input,.sheet textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);padding:10px 11px;font:inherit;font-size:16px}
.field textarea,.sheet textarea{resize:vertical;line-height:1.5}
.mini-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--accent);font-weight:600}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.cover-pv{margin-bottom:14px}
.cover-pv canvas{width:100%;display:block;background:#fff;box-shadow:var(--shadow);border-radius:2px}
.cv-note{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}

/* photo pages */
.page-head{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.page-head b{font-size:14px}
.page-head .acts{display:flex;gap:6px}
.paper{background:#fff;color:#222;width:100%;aspect-ratio:210/297;padding:3.6%;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);border-radius:2px}
.paper.landscape{aspect-ratio:297/210}
.phd{border:0;background:#F4F6F7;color:#333;text-align:left;font-size:10px;line-height:1.5;padding:4px 6px;border-radius:3px;display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.phd.none{display:block;color:#7A878C;text-align:center;background:none;border:1px dashed #C4CCD0}
.phd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));border:1px solid #333}
.slot{border:.5px solid #555;background:#fff;color:#222;padding:0;display:flex;flex-direction:column;min-height:0;min-width:0;text-align:left;position:relative}
.slot.sel{outline:3px solid var(--accent);outline-offset:-3px;z-index:2}
.slab{font-size:9px;font-weight:700;text-align:center;border-bottom:.5px solid #888;padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.simg{flex:1;min-height:0;position:relative;overflow:hidden;container-type:size;margin:3px;background:#F1F3F4}
.simg img{position:absolute;inset:0;width:100%;height:100%;object-fit:var(--fit,cover)}
.simg img.r90,.simg img.r270{inset:auto;top:50%;left:50%;width:100cqh;height:100cqw}
.simg img.r90{transform:translate(-50%,-50%) rotate(90deg)}
.simg img.r270{transform:translate(-50%,-50%) rotate(270deg)}
.simg img.r180{transform:rotate(180deg)}
.plus{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#5D7884;font-size:20px;line-height:1.1}
.plus small{font-size:9px;margin-top:2px}
.scap{border-top:.5px solid #999;padding:1px 4px 2px;font-size:8.5px;line-height:1.35}
.scap span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addpage{width:100%;margin-top:16px;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:14px;color:var(--accent);font-weight:700}
.swapbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);z-index:5;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;font-size:14px;font-weight:600}
.swapbar button{border:0;background:var(--accent-ink);color:var(--accent);border-radius:999px;padding:5px 14px;font-weight:700}

/* preview */
.pv{display:flex;flex-direction:column;gap:18px}
.pv-page{margin:0}
.pv-page canvas{width:100%;display:block;background:#fff;box-shadow:var(--shadow)}
.pv-page figcaption{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 14px;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.dock-in .btn{flex:1}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(10,20,25,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sh-head b{font-size:17px}
.sh-close{border:0;background:none;color:var(--accent);font-weight:700;padding:6px}
.sheet label{display:block;margin-top:10px;font-size:12px;color:var(--muted)}
.sheet label input,.sheet label textarea{margin-top:4px}
.sh-img{height:190px;background:#F1F3F4;border-radius:10px;position:relative;overflow:hidden;container-type:size;margin-top:4px}
.sh-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.sh-img img.r90,.sh-img img.r270{inset:auto;top:50%;left:50%;width:100cqh;height:100cqw}
.sh-img img.r90{transform:translate(-50%,-50%) rotate(90deg)}
.sh-img img.r270{transform:translate(-50%,-50%) rotate(270deg)}
.sh-img img.r180{transform:rotate(180deg)}
.gbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.rbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.vbtns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sh-text{font-size:14px;color:var(--muted);margin:4px 0 0}
.notice{background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:12px;margin-top:14px;font-size:14px}
.notice .btn{margin-top:10px}

/* toast & busy */
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;width:min(92vw,440px);pointer-events:none}
.t{background:var(--ink);color:var(--surface);padding:11px 14px;border-radius:12px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:auto;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.t button{border:0;background:var(--warn);color:#1E1606;border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;flex:none}
#busy{position:fixed;inset:0;z-index:70;background:rgba(10,20,25,.55);display:flex;align-items:center;justify-content:center}
#busy[hidden]{display:none}
.busy-box{background:var(--surface);border-radius:16px;padding:20px 26px;text-align:center;min-width:220px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.warnbar{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}

/* account & sync */
.acct{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--accent);margin-left:auto;white-space:nowrap}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:0 2px 10px}
.sync i{width:8px;height:8px;border-radius:50%;background:#3E9A6A;flex:none}
.sync.pending i{background:var(--warn)}.sync.busy i{background:var(--accent);animation:pl 1s ease-in-out infinite}.sync.err i{background:var(--danger)}
@keyframes pl{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sync.busy i{animation:none}}
.auth{max-width:400px;margin:6vh auto 0;padding:0 4px}
.auth-head{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;text-align:center}
.auth-head .brand-mark{width:44px;height:56px}
.auth-head .brand-mark::before{left:7px;right:7px;top:10px;height:3px;box-shadow:0 8px 0 var(--ink),0 16px 0 var(--accent),0 24px 0 var(--accent)}
.auth-t{font-size:21px;font-weight:700;letter-spacing:.08em}
.auth-s{font-size:13px;color:var(--muted)}
.auth .fgroup{padding:6px 16px 16px}
.auth .btn.primary{margin-top:16px}
.auth-alt{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:14px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 2px}
.auth-msg{font-size:13px;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.auth-msg.err{background:var(--warn-soft);border:1px solid var(--warn)}
.kv{font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.kv span{color:var(--muted)}
.kv b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<header class="bar" id="bar"></header>
<main id="view"></main>
<div class="dock" id="dock" hidden><div class="dock-in" id="dockIn"></div></div>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" aria-live="polite"></div>
<div id="busy" hidden><div class="busy-box"><div class="spin"></div><div id="busyText">処理中</div></div></div>
<input type="file" id="picker" class="vh" accept="image/*" multiple tabindex="-1" aria-hidden="true">
<input type="file" id="picker1" class="vh" accept="image/*">

<script>
"use strict";
/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function todayStr() { const d = new Date(); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`; }
function fmtDate(t) { const d = new Date(t); return `${d.getMonth() + 1}月${d.getDate()}日 ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; }

/* ---------- storage (IndexedDB, in-memory fallback) ---------- */
const DB = {
  db: null, mem: null,
  name: "sagyo-hokoku",
  close() { try { this.db && this.db.close(); } catch (e) {} this.db = null; this.mem = null; },
  async open(name = "sagyo-hokoku") {
    this.close(); this.name = name;
    try {
      await new Promise((res, rej) => {
        const req = indexedDB.open(name, 2);
        req.onupgradeneeded = () => {
          const d = req.result;
          if (!d.objectStoreNames.contains("reports")) d.createObjectStore("reports", { keyPath: "id" });
          if (!d.objectStoreNames.contains("images")) d.createObjectStore("images");
          if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta");
        };
        req.onsuccess = () => { this.db = req.result; res(); };
        req.onerror = () => rej(req.error);
        setTimeout(() => rej(new Error("timeout")), 4000);
      });
    } catch (e) {
      this.mem = { reports: new Map(), images: new Map() };
    }
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const r = fn(t.objectStore(store));
      let out;
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  },
  async getAll() { return this.mem ? [...this.mem.reports.values()].map(x => JSON.parse(JSON.stringify(x))) : (await this.tx("reports", "readonly", s => s.getAll())) || []; },
  async get(id) { return this.mem ? JSON.parse(JSON.stringify(this.mem.reports.get(id) || null)) : this.tx("reports", "readonly", s => s.get(id)); },
  async put(r) { if (this.mem) { this.mem.reports.set(r.id, JSON.parse(JSON.stringify(r))); return; } return this.tx("reports", "readwrite", s => s.put(r)); },
  async del(id) { if (this.mem) { this.mem.reports.delete(id); return; } return this.tx("reports", "readwrite", s => s.delete(id)); },
  async putImg(id, b) { if (this.mem) { this.mem.images.set(id, b); return; } return this.tx("images", "readwrite", s => s.put(b, id)); },
  async getImg(id) { if (this.mem) return this.mem.images.get(id); return this.tx("images", "readonly", s => s.get(id)); },
  async delImg(id) { if (this.mem) { this.mem.images.delete(id); return; } return this.tx("images", "readwrite", s => s.delete(id)); },

const imgCache = new Map();
function loadImg(id) {

/* ---------- cloud (Supabase) ---------- */
const CFG = window.HOKOKU_CONFIG || {};
const Cloud = {
  sb: null, user: null, state: "ok", pending: new Set(), deleted: new Set(), uploaded: new Set(), running: null,
  init() {
    if (!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase) return false;
    this.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: "hokoku-auth" }
    });
    return true;
  },
  path(id) { return `${this.user.id}/${id}.jpg`; },
  async loadMeta() {
    this.pending = new Set((await DB.getMeta("pending")) || []);
    this.deleted = new Set((await DB.getMeta("deleted")) || []);
    this.uploaded = new Set((await DB.getMeta("uploaded")) || []);
  },
  async saveMeta() {
    await DB.putMeta("pending", [...this.pending]);
    await DB.putMeta("deleted", [...this.deleted]);
    await DB.putMeta("uploaded", [...this.uploaded]);
  },
  setState(st) { this.state = st; const el = $("#sync"); if (el) el.outerHTML = syncChip(); },
  async pushOne(r) {
    const ids = [...new Set(r.slots.map(s => s.imgId).filter(Boolean))].filter(id => !this.uploaded.has(id));
    for (let i = 0; i < ids.length; i += 3) {
      await Promise.all(ids.slice(i, i + 3).map(async id => {
        const data = await DB.getImg(id);
        if (!data) return;
        const blob = typeof data === "string" ? await (await fetch(data)).blob() : data;
        const { error } = await this.sb.storage.from("photos").upload(this.path(id), blob, { contentType: "image/jpeg", upsert: true });
        if (error) throw error;
        this.uploaded.add(id);
      }));
    }
    const { error } = await this.sb.from("reports").upsert({ id: r.id, user_id: this.user.id, data: r, updated_at: new Date(r.updatedAt).toISOString() });
    if (error) throw error;
  },
  async queue(r) {
    if (!this.user) return true;
    this.pending.add(r.id); this.deleted.delete(r.id);
    await this.saveMeta();
    return this.sync({ pull: false });
  },
  async remove(id) {
    if (!this.user) return;
    this.pending.delete(id); this.deleted.add(id);
    await this.saveMeta();
    this.sync({ pull: false, gc: true });
  },
  sync(opt = {}) {
    if (!this.user) return Promise.resolve(true);

    this.running = this._sync(opt).finally(() => {
      this.running = null;
      if (this.again) { const o = this.again; this.again = null; this.sync(o); }
    });
    return this.running;
  },
  async _sync({ pull = true, gc = false } = {}) {
    if (!navigator.onLine) { this.setState(this.pending.size || this.deleted.size ? "pending" : "offline"); return false; }
    this.setState("busy");
    let changed = false;
    try {
      for (const id of [...this.deleted]) {
        const { error } = await this.sb.from("reports").delete().eq("id", id);
        if (error) throw error;
        this.deleted.delete(id); await this.saveMeta();
      }
      for (const id of [...this.pending]) {
        const r = await DB.get(id);
        if (r) await this.pushOne(r);
        this.pending.delete(id); await this.saveMeta();
      }
      if (pull) changed = await this.pull();
      if (gc || pull) await this.gc();
      this.setState("ok");
      if (changed && S.screen === "home" && $("#sheetWrap").hidden) renderHome(true);
      return true;
    } catch (e) {
      console.warn("sync", e);
      this.setState(this.pending.size || this.deleted.size ? "pending" : "err");
      return false;
    }
  },
  async pull() {
    const { data, error } = await this.sb.from("reports").select("id,data");
    if (error) throw error;
    const local = new Map((await DB.getAll()).map(r => [r.id, r]));
    const remote = new Set();
    let changed = false;
    for (const row of data || []) {
      remote.add(row.id);
      const l = local.get(row.id), rr = row.data;
      if (!rr || this.pending.has(row.id) || this.deleted.has(row.id)) continue;
      if (S.screen === "editor" && S.report && S.report.id === row.id && S.dirty) continue;
      if (!l || (rr.updatedAt || 0) > (l.updatedAt || 0)) { await DB.put(rr); changed = true; }
    }
    for (const [id] of local) {
      if (!remote.has(id) && !this.pending.has(id)) {
        if (S.screen === "editor" && S.report && S.report.id === id) continue;
        await DB.del(id); changed = true;
      }
    }
    return changed;
  },
  async gc() {
    const list = await DB.getAll();
    const used = new Set();
    list.forEach(r => r.slots.forEach(s => s.imgId && used.add(s.imgId)));
    if (S.report) S.report.slots.forEach(s => s.imgId && used.add(s.imgId));
    const { data, error } = await this.sb.storage.from("photos").list(this.user.id, { limit: 1000 });
    if (error || !data) return;
    const day = Date.now() - 864e5;
    const dead = data.filter(o => /\.jpg$/.test(o.name) && !used.has(o.name.replace(/\.jpg$/, "")) && (!o.created_at || Date.parse(o.created_at) < day)).map(o => o.name);
    if (dead.length) {
      await this.sb.storage.from("photos").remove(dead.map(n => `${this.user.id}/${n}`));
      dead.forEach(n => this.uploaded.delete(n.replace(/\.jpg$/, "")));
      await this.saveMeta();
    }
  },
  async fetchImg(id) {
    try {
      const { data, error } = await this.sb.storage.from("photos").download(this.path(id));
      if (error || !data) return null;
      const url = await readAsDataURL(data.type ? data : new Blob([data], { type: "image/jpeg" }));
      await DB.putImg(id, url); this.uploaded.add(id);
      return url;
    } catch (e) { return null; }
  }
};

function readOldDb() {
  return new Promise(res => {
    try {
      const req = indexedDB.open("sagyo-hokoku");
      req.onupgradeneeded = () => { req.transaction.abort(); };
      req.onerror = () => res(null);
      req.onsuccess = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains("reports")) { d.close(); return res(null); }
        const t = d.transaction(["reports", "images"], "readonly");
        const out = { reports: [], images: new Map() };
        t.objectStore("reports").getAll().onsuccess = e => { out.reports = e.target.result || []; };
        const ci = t.objectStore("images").openCursor();
        ci.onsuccess = e => { const c = e.target.result; if (c) { out.images.set(c.key, c.value); c.continue(); } };
        t.oncomplete = () => { d.close(); res(out); };
        t.onerror = () => { d.close(); res(null); };
      };
    } catch (e) { res(null); }
  });
}

    g.translate((b.x + b.w / 2) * s, (b.y + b.h / 2) * s);
    g.rotate(rot * Math.PI / 180);

async function photoPage(p, r, pi) {
  const W = p.W, H = p.H, land = r.orientation === "landscape";
  const m = land ? 10 : 12;
  const slots = pageSlots(r, pi);
  const hd = r.headers[pi] || {};
  let top = m;
  const pairs = [["場所", hd.place], ["施工エリア", hd.area], ["日時", hd.date], ["曜日", hd.weekday]];
  if (pairs.some(x => x[1])) {
    if (land) {
      const cw = (W - 2 * m) / 4;
      pairs.forEach(([k, v], i) => {
        const x = m + i * cw;
        p.text(k + "：", x + 1, top + 4, { size: 3.4, fam: GOTHIC, weight: "600" });
        p.fitLine(v, x + 1 + p.measure(k + "：", 3.4, GOTHIC, 0, "600") + 1, top + 4, cw - 22, { size: 3.4, fam: GOTHIC });
      });
      top += 11;
    } else {
      const half = (W - 2 * m) / 2;
      pairs.forEach(([k, v], i) => {
        const x = m + (i % 2) * half + 2, y = top + 6 + Math.floor(i / 2) * 10;
        p.text(k, x, y, { size: 3.6, fam: GOTHIC, weight: "600" });
        p.text("：", x + 22, y, { size: 3.6, fam: GOTHIC });
        p.fitLine(v, x + 30, y, half - 34, { size: 3.8, fam: GOTHIC });
      });
      top += 25;
    }
  }
  const [cols, rows] = grid(r.orientation, r.perPage);
  const gx = m, gw = W - 2 * m, gy = top, gh = H - m - top;
  const cw = gw / cols, ch = gh / rows;
  const hasLabel = slots.some(s => s.label);
  p.rect(gx, gy, gw, gh, 0.45);
  for (let i = 0; i < r.perPage; i++) {
    const s = slots[i] || emptySlot();
    const x = gx + (i % cols) * cw, y = gy + Math.floor(i / cols) * ch;
    p.rect(x, y, cw, ch, 0.3);
    const fs = clamp(Math.min(cw, ch * 1.3) * 0.042, 2.3, 3.5);
    let iy = y;
    if (hasLabel) {
      const lh = fs * 1.9;
      p.fitLine(s.label, x + cw / 2, y + lh / 2, cw - 4, { size: fs * 1.1, fam: GOTHIC, weight: "600", align: "center" });
      p.line(x, y + lh, x + cw, y + lh, 0.22);
      iy = y + lh;
    }
    const lineH = fs * 1.5;
    const capH = lineH * 3 + 1.2;
    const cy = y + ch - capH;
    const box = { x: x + 1.4, y: iy + 1.4, w: cw - 2.8, h: cy - iy - 2.8 };
    if (s.imgId) {
      const o = await loadImg(s.imgId);
      if (o && o.img) p.image(o.img, box, s.rot || 0, r.fit);
    }
    p.line(x, cy, x + cw, cy, 0.22);
    p.text("場所：", x + 1.6, cy + 0.6 + lineH / 2, { size: fs, fam: GOTHIC, weight: "600" });
    const lw = p.measure("場所：", fs, GOTHIC, 0, "600");
    p.fitLine(s.place, x + 1.6 + lw, cy + 0.6 + lineH / 2, cw - 3.2 - lw, { size: fs, fam: GOTHIC, min: fs * 0.75 });
    p.text("内容：", x + 1.6, cy + 0.6 + lineH * 1.5, { size: fs, fam: GOTHIC, weight: "600" });
    p.block(s.content, x + 1.6 + lw, cy + 0.6 + lineH, cw - 3.2 - lw, lineH * 2, { max: fs, min: fs * 0.75, fam: GOTHIC, lh: 1.5 });
  }
}

async function renderPreview() {
  const r = S.report;

async function placeFiles(files, start) {
  const r = S.report;
  let list = [...files];
  if (!list.length) return;
  let over = false;
  if (list.length > 10) { list = list.slice(0, 10); over = true; }
  let i = start < 0 ? r.slots.findIndex(s => !s.imgId) : start;
  if (i < 0) i = r.slots.length;
  busy(true, `写真を読み込み中 0/${list.length}`);
  let ok = 0;
  for (let k = 0; k < list.length; k++) {
    try {
      const id = await processFile(list[k]);
      while (i < r.slots.length && r.slots[i].imgId) i++;
      if (i >= r.slots.length) r.slots.push(emptySlot());
      r.slots[i].imgId = id; r.slots[i].rot = 0;
      if (!r.slots[i].place && r.headers[Math.floor(i / r.perPage)]) {
        // leave place empty; user fills it in
      }
      i++; ok++;
    } catch (e) { /* skip unreadable file */ }
    $("#busyText").textContent = `写真を読み込み中 ${k + 1}/${list.length}`;
  }
  normalize(r);
  busy(false);
  markDirty();
  if (S.tab !== "photos") { S.tab = "photos"; renderEditor(); } else renderPhotos();
  if (over) toast("一度に追加できるのは10枚までです。最初の10枚を並べました");
  else if (ok < list.length) toast(`${list.length - ok}枚は読み込めませんでした`);
  else toast(`${ok}枚を並べました`);
}
$("#picker").addEventListener("change", async e => {

});

/* ---------- PDF ---------- */
async function exportPdf() {
  if (!window.jspdf) { toast("PDF作成の部品を読み込めませんでした。通信状態を確認して開き直してください"); return; }
  const r = S.report;
  const pages = exportPages(r);
  const land = r.orientation === "landscape";
  const [W, H] = land ? [297, 210] : [210, 297];
  busy(true, `PDFを作成中 0/${pages.length}`);
  try {
    const doc = new window.jspdf.jsPDF({ orientation: land ? "landscape" : "portrait", unit: "mm", format: "a4", compress: true });
    for (let k = 0; k < pages.length; k++) {
      $("#busyText").textContent = `PDFを作成中 ${k + 1}/${pages.length}`;
      await sleep(20);
      const cv = await renderPage(r, pages[k], 7);
      if (k) doc.addPage("a4", land ? "landscape" : "portrait");
      doc.addImage(cv.toDataURL("image/jpeg", 0.9), "JPEG", 0, 0, W, H, undefined, "FAST");
      cv.width = cv.height = 1;
    }
    const blob = doc.output("blob");
    const base = (displayName(r) || "作業完了報告書").replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, "_");
    S.pdf = { blob, name: `${base}.pdf`, pages: pages.length };
    busy(false);
    openPdfSheet();
  } catch (e) {
    busy(false);
    toast("PDFを作れませんでした。写真の枚数を減らしてもう一度お試しください");
  }
}
function openPdfSheet() {
  const p = S.pdf, r = S.report;
  openSheet(`<div class="sh-head"><b>PDFができました</b><button class="sh-close" data-act="closeSheet">閉じる</button></div>
    <p class="sh-text">${p.pages}ページ・A4${r.orientation === "portrait" ? "縦" : "横"}・${(p.blob.size / 1024 / 1024).toFixed(1)}MB</p>
    <div class="vbtns"><button class="btn primary block" data-act="savePdf">PDFを保存する</button></div>
    <p class="sh-text" style="font-size:13px;margin-top:10px">iPhoneでは共有メニューが開いたら「“ファイル”に保存」を選ぶと、ファイルアプリに残せます。メールやLINEで直接送ることもできます。</p>
    ${S.dirty ? `<div class="notice" id="pdfDirty">報告書のデータがまだ保存されていません。あとで直せるように、こちらも保存しておきましょう。<button class="btn block" data-act="save">報告書を保存</button></div>` : ""}`);
}
async function savePdf() {
  const p = S.pdf; if (!p) return;
  let dl = null;
  if (downloadsP) dl = await Promise.race([downloadsP.catch(() => null), sleep(2500).then(() => null)]);
  if (dl) {
    try {
      await dl.save({ filename: p.name, data: p.blob });
      afterPdfSaved(); return;
    } catch (e) {
      const code = e && e.code;
      if (code === "declined") { toast("保存をキャンセルしました"); return; }
      if (code === "rate_limited") { toast("少し待ってからもう一度押してください"); return; }
      if (code === "too_large") { toast("ファイルが大きすぎます。1ページの枚数や写真を減らしてください"); return; }
    }
  }
  const file = new File([p.blob], p.name, { type: "application/pdf" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: p.name }); afterPdfSaved(); return; }
    catch (e) { if (e && e.name === "AbortError") { toast("保存をキャンセルしました"); return; } }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(p.blob); a.download = p.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  afterPdfSaved();
}
function afterPdfSaved() {
  closeSheet();
  if (S.dirty) toast("PDFを保存しました。報告書のデータも保存しますか？", { action: "保存", onAction: saveReport, ms: 10000 });
  else toast("PDFを保存しました");
}

    const n = Cloud.pending.size + Cloud.deleted.size;
    const go = async () => {
      const uidv = Cloud.user && Cloud.user.id;
      busy(true, "ログアウトしています");
      try { await Cloud.sb.auth.signOut(); } catch (e) {}
      Cloud.user = null; imgCache.clear(); DB.close();
      if (uidv && !n) { try { indexedDB.deleteDatabase("hokoku-" + uidv); } catch (e) {} }
      busy(false); renderAuth("login", "ログアウトしました");
    };
    if (n) confirmSheet("未送信のデータがあります", `クラウドにまだ送っていない変更が${n}件あります。ログアウトしてもこの端末には残り、次にログインしたときに送ります。`, "ログアウトする", go);
    else confirmSheet("ログアウトしますか？", "報告書はクラウドに保存されているので、もう一度ログインすれば続きから使えます。", "ログアウトする", go);
  },
  async importOld() {
    const old = S._old; S._old = null; if (!old) return closeSheet();
    closeSheet(); busy(true, "取り込んでいます");
    try {
      const have = new Set((await DB.getAll()).map(r => r.id));
      for (const [k, v] of old.images) { const data = typeof v === "string" ? v : await readAsDataURL(v); await DB.putImg(k, data); }
      for (const r of old.reports) { if (have.has(r.id)) continue; await DB.put(r); Cloud.pending.add(r.id); }
      await Cloud.saveMeta();
      busy(false); renderHome(); toast(`${old.reports.length}件取り込みました`);
      Cloud.sync();
    } catch (e) { busy(false); toast("取り込めませんでした"); }
  },
  async confirmOk() { const fn = S._confirm; S._confirm = null; closeSheet(); if (fn) await fn(); },
  closeSheet() { closeSheet(); },
  closeSheetRender() { closeSheet(); afterSheetClose(); },
  back() {
    if (!S.dirty) return renderHome();
    openSheet(`<div class="sh-head"><b>保存していない変更があります</b></div><p class="sh-text">一覧に戻る前に保存しますか？</p>
      <div class="vbtns"><button class="btn primary block" data-act="saveBack">保存して戻る</button>
      <button class="btn block danger" data-act="discardBack">保存せずに戻る</button>
      <button class="btn block" data-act="closeSheet">編集を続ける</button></div>`);
  },
  async saveBack() { closeSheet(); await saveReport(); renderHome(); },
  discardBack() { closeSheet(); S.dirty = false; if (S.remind) { clearTimeout(S.remind); S.remind = null; } renderHome(); },
  save() { saveReport(); },
  tab(el) { S.tab = el.dataset.tab; S.swap = false; S.swapFirst = -1; renderEditor(); window.scrollTo(0, 0); },
  orient(el) {
    const r = S.report, o = el.dataset.o;
    if (r.orientation === o) return;
    const wasDefault = r.perPage === DEFPER[r.orientation];
    r.orientation = o;
    if (wasDefault) r.perPage = DEFPER[o];
    r.perPage = Math.min(r.perPage, MAXPER[o]);
    trimTrailing(r);
    markDirty(); renderEditor();
  },
  per(el) {
    const r = S.report;
    r.perPage = clamp(r.perPage + Number(el.dataset.d), 1, MAXPER[r.orientation]);
    trimTrailing(r);
    markDirty(); renderPhotos();
  },
  fit(el) { S.report.fit = el.dataset.v; markDirty(); renderPhotos(); },
  today(el) {
    const k = el.dataset.k; S.report.cover[k] = todayStr();
    const inp = view.querySelector(`[data-f="cover.${k}"]`); if (inp) inp.value = S.report.cover[k];
    markDirty(); drawCoverPreview();
  },
  addPhotos() { S.pickStart = -1; $("#picker").click(); },
  pickFrom(el) { closeSheet(); S.pickStart = Number(el.dataset.i); $("#picker").click(); },
  swapMode() { S.swap = !S.swap; S.swapFirst = -1; renderPhotos(); },
  slot(el) {
    const i = Number(el.dataset.i), r = S.report;
    if (S.swap) {
      if (S.swapFirst < 0) { S.swapFirst = i; renderPhotos(); return; }
      if (S.swapFirst !== i) { const a = r.slots[S.swapFirst]; r.slots[S.swapFirst] = r.slots[i]; r.slots[i] = a; markDirty(); }
      S.swapFirst = -1; renderPhotos(); return;
    }
    if (!r.slots[i].imgId && isEmptySlot(r.slots[i])) { S.pickStart = i; $("#picker").click(); return; }
    openSlotSheet(i);
  },
  slotReplace() { S.replaceIdx = S.editSlot; $("#picker1").click(); },
  slotRotate() {
    const s = S.report.slots[S.editSlot]; s.rot = ((s.rot || 0) + 90) % 360;
    const im = $("#shImg"); if (im) im.className = s.rot ? `r${s.rot}` : "";
    markDirty();
  },
  slotMove(el) {
    const r = S.report, i = S.editSlot, j = i + Number(el.dataset.d);
    if (j < 0 || j >= r.slots.length) return;
    [r.slots[i], r.slots[j]] = [r.slots[j], r.slots[i]];
    markDirty(); renderPhotos(); openSlotSheet(j);
  },
  slotClear() { const s = S.report.slots[S.editSlot]; s.imgId = null; s.rot = 0; markDirty(); renderPhotos(); openSlotSheet(S.editSlot); },
  slotDelete() {
    const r = S.report; r.slots.splice(S.editSlot, 1); normalize(r);
    markDirty(); closeSheet(); renderPhotos(); toast("枠を削除して後ろの写真を詰めました");
  },
  applyPage(el) {
    const r = S.report, k = el.dataset.k, v = r.slots[S.editSlot][k];
    const pi = Math.floor(S.editSlot / r.perPage);
    pageSlots(r, pi).forEach(s => { s[k] = v; });
    markDirty(); toast(k === "place" ? "場所をこのページの全写真に入れました" : "内容をこのページの全写真に入れました");
  },
  editHeader(el) { openHeaderSheet(Number(el.dataset.p)); },
  headerAll() { const r = S.report, h = r.headers[S.editPage]; r.headers = r.headers.map(() => ({ ...h })); markDirty(); toast("全ページに同じ見出しを入れました"); },
  headerClear() { S.report.headers[S.editPage] = { place: "", area: "", date: "", weekday: "" }; markDirty(); closeSheet(); renderPhotos(); },
  addPage() {
    const r = S.report;
    for (let k = 0; k < r.perPage; k++) r.slots.push(emptySlot());
    normalize(r); markDirty(); renderPhotos();
    window.scrollTo(0, document.body.scrollHeight);
  },
  delPage(el) {
    const pi = Number(el.dataset.p);
    confirmSheet(`${pi + 1}ページ目を削除しますか？`, "このページの写真と文字がなくなり、後ろのページが前に詰まります。", "削除する", () => {
      const r = S.report;
      r.slots.splice(pi * r.perPage, r.perPage);
      r.headers.splice(pi, 1);
      normalize(r); markDirty(); renderPhotos();
    });
  },
  exportPdf() { exportPdf(); },
  savePdf() { savePdf(); }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (!S.report) return;
  if (el.dataset.f) {
    const v = el.type === "checkbox" ? el.checked : el.value;
    const parts = el.dataset.f.split(".");
    let o = S.report; for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = v;
    markDirty();
    clearTimeout(S.cvTimer); S.cvTimer = setTimeout(drawCoverPreview, 250);
  } else if (el.dataset.sf && S.editSlot >= 0) {
    S.report.slots[S.editSlot][el.dataset.sf] = el.value; markDirty();
  } else if (el.dataset.hf && S.editPage >= 0) {
    S.report.headers[S.editPage][el.dataset.hf] = el.value; markDirty();
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.type === "checkbox" && el.dataset.f === "cover.stamp" && S.report) {
    if (S.report.cover.stamp !== el.checked) { S.report.cover.stamp = el.checked; markDirty(); drawCoverPreview(); }
  }
});
let rzT; window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { if (S.screen === "editor" && S.tab === "cover") drawCoverPreview(); }, 200); });

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && S.screen === "auth" && e.target.matches("#auEmail,#auPass")) {
    e.preventDefault();
    const b = view.querySelector(".btn.primary"); if (b) b.click();
  }
});
window.addEventListener("online", () => Cloud.sync());
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.screen === "home") Cloud.sync(); });

(async function init() {
  if (Cloud.init()) {
    Cloud.sb.auth.onAuthStateChange((ev) => {
      if (ev === "PASSWORD_RECOVERY") setTimeout(() => ACT.changePass(), 300);
    });
    let session = null;
    try { session = (await Cloud.sb.auth.getSession()).data.session; } catch (e) {}
    if (session) await startUser(session.user); else renderAuth();
  } else {
    await DB.open();
    await gcImages();
    renderHome();
  }
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("./sw.js").catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
</script>
</body>
